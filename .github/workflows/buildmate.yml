name: BuildMate QingJian Builder

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - preflight
      expected_source_sha256:
        description: '源码 ZIP SHA-256'
        required: false
        default: ''
      expected_source_bytes:
        description: '源码 ZIP 字节数'
        required: false
        default: ''
      source_name:
        description: '源码文件名'
        required: false
        default: ''
      expected_head_sha:
        description: '派发前 HEAD SHA'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Normalize mode and verify source
        id: prep
        shell: bash
        run: |
          set -Eeuo pipefail
          MODE='${{ inputs.mode }}'
          case "$MODE" in full|preflight) ;; *) MODE='full' ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          test -f app.zip || { echo "❌ app.zip 不存在"; exit 10; }

          ACTUAL_SHA="$(shasum -a 256 app.zip | awk '{print $1}')"
          ACTUAL_BYTES="$(wc -c < app.zip | tr -d ' ')"
          EXPECTED_SHA='${{ inputs.expected_source_sha256 }}'
          EXPECTED_BYTES='${{ inputs.expected_source_bytes }}'

          echo "Source SHA256: $ACTUAL_SHA"
          echo "Source bytes:  $ACTUAL_BYTES"

          if [ -n "$EXPECTED_SHA" ] && [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ SHA256 不一致"; exit 11
          fi
          if [ -n "$EXPECTED_BYTES" ] && [ "$ACTUAL_BYTES" != "$EXPECTED_BYTES" ]; then
            echo "❌ 源码大小不一致"; exit 12
          fi
          echo "✅ 源码指纹通过"

      - name: 3. Extract and locate project
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf src _root
          mkdir src
          unzip -q app.zip -d src

          if [ ! -f src/project.yml ]; then
            P="$(find src -type f -name project.yml -print -quit || true)"
            test -n "$P" || { echo "❌ 找不到 project.yml"; exit 20; }
            ROOT="$(dirname "$P")"
            mkdir _root
            cp -R "$ROOT"/. _root/
            rm -rf src
            mv _root src
          fi

          test -f src/project.yml
          echo "✅ project.yml: src/project.yml"

      - name: 4. Preflight complete
        if: ${{ steps.prep.outputs.mode == 'preflight' }}
        run: echo "✅ Preflight completed"

      - name: 5. Install XcodeGen
        if: ${{ steps.prep.outputs.mode == 'full' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: 6. Generate project and resolve scheme
        if: ${{ steps.prep.outputs.mode == 'full' }}
        working-directory: src
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodegen generate

          PROJECT="$(find . -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT" || { echo "❌ xcodeproj 未生成"; exit 30; }

          LIST="$(xcodebuild -project "$PROJECT" -list -json)"
          SCHEME="$(printf '%s' "$LIST" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("project",{}).get("schemes",[]); print(s[0] if s else "")')"
          test -n "$SCHEME" || { echo "❌ Scheme 不存在"; exit 31; }

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Project=$PROJECT"
          echo "Scheme=$SCHEME"

      - name: 7. Build unsigned app
        if: ${{ steps.prep.outputs.mode == 'full' }}
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          rm -rf build Payload
          rm -f ./*.ipa compile.log compile-errors.txt packaging.log ipa-validation.log

          set +e
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee compile.log
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            grep -n -B 4 -A 10 -E 'error:|fatal error:|SwiftCompile|CompileSwift|EmitSwiftModule|Command .* failed' compile.log \
              | tail -500 > compile-errors.txt || true
            [ -s compile-errors.txt ] || tail -400 compile.log > compile-errors.txt
            echo "❌ Xcode build failed: $RC"
            exit "$RC"
          fi
          echo "✅ Xcode BUILD SUCCEEDED"

      - name: 8. Validate app and package IPA
        if: ${{ steps.prep.outputs.mode == 'full' }}
        id: package
        working-directory: src
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee packaging.log) 2>&1
          trap 'RC=$?; echo "❌ PACKAGING FAILED rc=$RC line=$LINENO cmd=$BASH_COMMAND"; exit $RC' ERR

          echo "===== Locate .app ====="
          APP="$(find -L build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "$APP" ]; then
            APP="$(find -L build/Build/Products -type d -name '*.app' -path '*Release-iphoneos*' -print -quit 2>/dev/null || true)"
          fi
          test -n "$APP" && test -d "$APP" || { echo "❌ Release .app 不存在"; exit 40; }
          echo "APP=$APP"

          APP_NAME="$(basename "$APP" .app)"
          PLIST="$APP/Info.plist"
          test -f "$PLIST" || { echo "❌ Info.plist 不存在"; exit 41; }

          echo "===== Resolve executable ====="
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST" 2>/dev/null || true)"

          if [ -z "$EXEC" ]; then
            SETTINGS="$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build -showBuildSettings 2>/dev/null || true)"
            EXEC="$(printf '%s\n' "$SETTINGS" | awk -F' = ' '/ EXECUTABLE_NAME = / {print $2; exit}')"
          fi

          if [ -z "$EXEC" ] && [ -f "$APP/$APP_NAME" ]; then
            EXEC="$APP_NAME"
          fi

          if [ -z "$EXEC" ] || [ ! -f "$APP/$EXEC" ]; then
            CANDIDATE="$(find "$APP" -maxdepth 1 -type f -perm -111 ! -name '*.dylib' -print -quit 2>/dev/null || true)"
            if [ -n "$CANDIDATE" ]; then EXEC="$(basename "$CANDIDATE")"; fi
          fi

          test -n "$EXEC" && test -f "$APP/$EXEC" || {
            echo "❌ 找不到 APP 主可执行文件"
            ls -la "$APP"
            exit 42
          }
          echo "Executable=$EXEC"

          if command -v file >/dev/null 2>&1; then
            file "$APP/$EXEC" || true
          fi

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" 2>/dev/null || true)"
          [ -n "$VERSION" ] || VERSION="1.0.0"
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          [ -n "$SAFE_VERSION" ] || SAFE_VERSION="1.0.0"

          echo "Version=$VERSION"

          echo "===== Create Payload ====="
          rm -rf Payload
          mkdir Payload
          ditto "$APP" "Payload/$(basename "$APP")"

          test -f "Payload/$(basename "$APP")/$EXEC" || { echo "❌ Payload 主程序丢失"; exit 43; }

          IPA="QingJian-V${SAFE_VERSION}.ipa"
          rm -f "$IPA"
          /usr/bin/zip -qry "$IPA" Payload
          test -s "$IPA" || { echo "❌ IPA 未生成"; exit 44; }

          echo "===== Validate IPA ====="
          /usr/bin/unzip -tq "$IPA" | tee ipa-validation.log

          APP_ENTRY="$(/usr/bin/unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/$' | head -1 || true)"
          EXEC_ENTRY="Payload/$(basename "$APP")/$EXEC"

          test -n "$APP_ENTRY" || { echo "❌ IPA 中没有 Payload/*.app"; exit 45; }
          /usr/bin/unzip -Z1 "$IPA" | grep -Fxq "$EXEC_ENTRY" || { echo "❌ IPA 中没有主程序 $EXEC_ENTRY"; exit 46; }

          IPA_BYTES="$(wc -c < "$IPA" | tr -d ' ')"
          IPA_SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"

          echo "IPA=$IPA"
          echo "IPA bytes=$IPA_BYTES"
          echo "IPA sha256=$IPA_SHA"
          echo "file=$IPA" >> "$GITHUB_OUTPUT"
          echo "✅ IPA PACKAGING SUCCEEDED"

      - name: 9. Upload IPA
        if: ${{ steps.prep.outputs.mode == 'full' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: QingJian-IPA-${{ github.run_number }}
          path: src/${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: 10. Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BuildMate-Compile-Logs-${{ github.run_number }}
          path: |
            src/compile.log
            src/compile-errors.txt
            src/packaging.log
            src/ipa-validation.log
          if-no-files-found: ignore
          retention-days: 30
